name: Advanced Link Refresh

on:
  push:
    branches: [ main ]  # This makes it run automatically when you save
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:    # This adds the manual "Run workflow" button

jobs:
  refresh-job:
    runs-on: ubuntu-latest
    # This prevents the action from running in a loop when it pushes changes
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Refresh Script
        run: python advanced_refresh.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jiohd.json
          git commit -m "Automated link refresh: $(date)" || echo "No changes to commit"
          git push
